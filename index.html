<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Academic Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="student-theme">
<div class="app-container">
  <nav>
    <div class="nav-brand">🎓 Academic Portal</div>
    <div class="nav-links"><a href="aboutpage.html">ℹ️ About</a></div>
  </nav>

  <div class="page-content">
    <div id="welcomeContainer" class="section-box" style="text-align: center; max-width: 600px; margin: 40px auto;">
      <h2>Welcome! 👋</h2>
      <p style="margin: 15px 0;">Digital Class Announcement, Deadline Tracker, and Task Portal.</p>
      <button class="btn btn-primary" onclick="proceedToLogin()">Proceed to Login Form</button>
    </div>

    <div id="loginFormsContainer" class="login-split" style="display: none;">
      <div class="login-card">
        <h3>👤 Student Login</h3>
        <form onsubmit="handleStudentLogin(event)">
          <div class="form-group"><label>Google Account</label><input type="email" id="studGoogle" required></div>
          <div class="form-group"><label>Full Name</label><input type="text" id="studName" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="studPass" required></div>
          <div class="form-group"><label>Section</label><input type="text" id="studSec" required></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Login as Student</button>
        </form>
      </div>

      <div class="login-card">
        <h3>👨‍🏫 Teacher Login</h3>
        <div id="teacherAuthPrompt" style="text-align: center; padding: 30px 0;">
          <p>Are you an assigned Teacher?</p>
          <button class="btn btn-primary" onclick="verifyTeacherCode()">Yes, I am a Teacher</button>
        </div>
        <form id="teacherLoginForm" style="display: none;" onsubmit="handleTeacherLogin(event)">
          <div class="form-group"><label>Email</label><input type="email" required></div>
          <div class="form-group"><label>Password</label><input type="password" required></div>
          <div class="form-group"><label>Section</label><input type="text" required></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Login as Teacher</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
